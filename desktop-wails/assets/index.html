<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAL-Metrics Desktop HUD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b0e14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(12px);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #ff4655;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>VAL-Metrics Desktop HUD</h1>
    <p>Wails v3 Desktop Runtime Initialized</p>
    <p>Waiting for frontend build or dev server at http://localhost:1420...</p>
  </div>
</body>
</html>
